[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hnsw"
version = "0.1.0"
description = "HNSW approximate nearest-neighbor search, from scratch"
requires-python = ">=3.11"
dependencies = ["numpy==2.1.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "hypothesis==6.115.0", "hnswlib==0.8.0"]
search = ["torch==2.15.0", "sentence-transformers==6.2.0", "datasets==5.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
